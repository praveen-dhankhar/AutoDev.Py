[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-agent"
version = "0.1.0"
description = "Local multi-agent Python engineer with Docker-sandboxed execution."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Praveen Dhankhar" },
]
dependencies = [
    "crewai>=0.80.0",
    "langchain-ollama>=0.2.0",
    "streamlit>=1.36.0",
    "python-dotenv>=1.0.0",
    "pygments>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[project.scripts]
pr-agent = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]
