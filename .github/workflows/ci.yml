name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      SANDBOX_IMAGE: autodev-py-sandbox:ci
      SANDBOX_REQUIRED: "1"
      SANDBOX_ALLOW_NETWORK: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Docker is available
        run: |
          docker version
          docker info

      - name: Build sandbox image
        run: docker build -f sandbox.Dockerfile -t "$SANDBOX_IMAGE" .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
