name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Lint, test, build, and adversarial verification
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      SANDBOX_IMAGE: autodev-py-sandbox:ci
      SANDBOX_REQUIRED: "1"
      SANDBOX_ALLOW_NETWORK: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Run unit tests
        run: pytest -m "not docker"

      - name: Verify CLI entry point
        run: pr-agent --version

      - name: Build Python package
        run: python -m build

      - name: Verify Docker is available
        run: |
          docker version
          docker info

      - name: Build app image
        run: docker build -f Dockerfile -t autodev-py-app:ci .

      - name: Build sandbox image
        run: docker build -f sandbox.Dockerfile -t "$SANDBOX_IMAGE" .

      - name: Run adversarial sandbox suite
        run: pytest -m docker

  release-images:
    name: Build and push release Docker images
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build and push app image
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="$REGISTRY/$OWNER/autodev-py-app"
          docker build -f Dockerfile -t "$IMAGE:${GITHUB_REF_NAME}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_REF_NAME}"
          docker push "$IMAGE:latest"

      - name: Build and push sandbox image
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="$REGISTRY/$OWNER/autodev-py-sandbox"
          docker build -f sandbox.Dockerfile -t "$IMAGE:${GITHUB_REF_NAME}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_REF_NAME}"
          docker push "$IMAGE:latest"

  nightly-live-ollama:
    name: Nightly live Ollama smoke and benchmark
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OLLAMA_MODEL: qwen2.5-coder:7b
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_LIVE_TESTS: "1"
      AGENT_CALL_TIMEOUT: "180"
      SANDBOX_IMAGE: autodev-py-sandbox:ci
      SANDBOX_ALLOW_NETWORK: "0"
      # CPU runners are slow; the full 50-task suite is meant for local runs.
      EVAL_LIMIT: "20"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS "$OLLAMA_BASE_URL/api/tags" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull live smoke model
        run: ollama pull "$OLLAMA_MODEL"

      - name: Run live Ollama smoke test
        run: pytest tests/test_agents.py -q

      - name: Build sandbox image
        run: docker build -f sandbox.Dockerfile -t "$SANDBOX_IMAGE" .

      - name: Run self-correction benchmark
        run: python -m evals.run --limit "$EVAL_LIMIT" --out evals/results/nightly.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/nightly.json
          if-no-files-found: ignore
